<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <title>Joseph & Juliet | Guest Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--black:#111;--gold:#b58a35;--gold-light:#ead8aa;--paper:#fffdf9;--muted:#746f66;--line:#e8dfcd;--green:#28744c;--red:#a94a43}
    *{box-sizing:border-box}body{margin:0;background:#f4efe5;color:var(--black);font-family:Inter,system-ui,sans-serif}
    .page{width:min(100% - 24px,980px);margin:26px auto 50px}.shell{background:var(--paper);border:1px solid var(--gold-light);box-shadow:0 22px 60px #17110b1c;overflow:hidden}.top-rule{height:7px;background:linear-gradient(90deg,var(--black),var(--gold),#f2e6c5,var(--gold),var(--black))}
    header{padding:40px clamp(20px,6vw,70px) 26px;text-align:center;border-bottom:1px solid var(--line)}.eyebrow{margin:0;color:var(--gold);font:700 10px Inter,sans-serif;letter-spacing:.24em;text-transform:uppercase}.title{margin:9px 0 5px;font:600 clamp(46px,8vw,78px)/.82 "Cormorant Garamond",Georgia,serif}.title em{font-weight:500;color:var(--gold);font-style:italic}.subtitle{margin:14px 0 0;font:15px "Cormorant Garamond",Georgia,serif;letter-spacing:.12em;text-transform:uppercase}.live{display:inline-flex;align-items:center;gap:8px;margin-top:21px;color:var(--green);font:700 10px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #28744c1c}.live-dot.error{background:var(--red);box-shadow:0 0 0 4px #a94a431c}
    .content{padding:26px clamp(16px,5vw,60px) 42px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.metric{padding:17px 14px;border:1px solid var(--gold-light);background:#fff}.metric-number{display:block;color:var(--gold);font:700 32px/.9 "Cormorant Garamond",Georgia,serif}.metric-label{display:block;margin-top:8px;color:var(--muted);font:700 9px Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase}.tools{display:flex;gap:12px;align-items:center;margin-bottom:19px}.search{flex:1;padding:13px 15px;border:1px solid #cfc3aa;background:#fff;color:var(--black);font:14px Inter,sans-serif;outline:none}.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b58a3522}.updated{color:var(--muted);font:10px Inter,sans-serif;white-space:nowrap}.cards{display:grid;gap:13px}.guest-card{padding:20px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);box-shadow:0 5px 18px #17110b0b}.guest-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.guest-name{margin:0;font:600 28px/1 "Cormorant Garamond",Georgia,serif}.badge{padding:6px 9px;background:#e7f3ea;color:var(--green);font:700 9px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.detail-label{display:block;color:var(--muted);font:700 9px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}.detail-value{display:block;margin-top:5px;font:16px/1.25 "Cormorant Garamond",Georgia,serif}.attending-names{margin-top:17px;padding:13px;background:#fbf7ee}.attending-names .detail-value{font-size:17px}.submitted{margin-top:13px;color:var(--muted);font:10px Inter,sans-serif}.empty,.error-box{padding:28px;text-align:center;border:1px dashed var(--gold-light);color:var(--muted);font:14px/1.6 "Cormorant Garamond",Georgia,serif}.error-box{border-color:#e0b7b2;color:var(--red)}footer{padding:18px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font:10px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:650px){.summary{grid-template-columns:1fr 1fr}.summary .metric:last-child{grid-column:1/-1}.tools{align-items:stretch;flex-direction:column}.updated{white-space:normal}.details{grid-template-columns:1fr 1fr}.guest-top{flex-direction:column}.title{font-size:54px}}
  </style>
</head>
<body>
  <main class="page"><section class="shell"><div class="top-rule"></div>
    <header><p class="eyebrow">Joseph & Juliet</p><h1 class="title">Guest <em>Attendance</em></h1><p class="subtitle">Monday, 21 December 2026</p><div class="live" aria-live="polite"><span id="live-dot" class="live-dot"></span><span id="status-text">Live RSVP Updates</span></div></header>
    <div class="content">
      <section class="summary" aria-label="Live summary"><div class="metric"><span id="confirmed" class="metric-number">0</span><span class="metric-label">Confirmed invitations</span></div><div class="metric"><span id="attending" class="metric-number">0</span><span class="metric-label">People attending</span></div><div class="metric"><span id="additional" class="metric-number">0</span><span class="metric-label">Additional guests</span></div></section>
      <div class="tools"><input id="search" class="search" type="search" placeholder="Search guests by name" aria-label="Search guests by name" /><span id="updated" class="updated">Waiting for responses…</span></div>
      <section id="guest-cards" class="cards" aria-live="polite"><div class="empty">Loading confirmations…</div></section>
    </div><footer>Joseph & Juliet · Guest attendance</footer>
  </section></main>
  <script src="dashboard.js"></script>
</body>
</html>
