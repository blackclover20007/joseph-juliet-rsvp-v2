<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Admin | Joseph & Juliet RSVP</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="styles.css"/><style>.admin-page{width:min(100% - 30px,980px);margin:38px auto;padding-bottom:30px}.admin-login,.admin-table-wrap{background:rgba(255,253,249,.97);border:1px solid rgba(45,111,163,.28);box-shadow:var(--shadow)}.admin-login{max-width:430px;margin:90px auto;padding:42px 34px;text-align:center}.admin-login h1,.admin-top h1{font-size:clamp(42px,7vw,64px);line-height:.9;margin:10px 0 24px}.admin-login input{display:block;width:100%;margin:10px 0;padding:14px;border:1px solid var(--line);background:#ffffff;font:15px Inter,sans-serif}.admin-error{color:#9b3d4b;font:12px Inter,sans-serif;margin-top:12px}.admin-top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-button{border:1px solid var(--accent);background:var(--paper);color:var(--ink);padding:12px 15px;font:700 10px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.admin-button.primary{background:var(--ink);color:var(--paper)}.admin-note{margin:0 0 22px;color:var(--muted);font:13px/1.5 Inter,sans-serif}.admin-table-wrap{overflow-x:auto}table{width:100%;min-width:720px;border-collapse:collapse;text-align:left}th{background:#e5f0f8;color:var(--accent-dark);font:700 10px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}th,td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:top}td{font:17px/1.3 "Cormorant Garamond",Georgia,serif}td small{color:var(--muted);font:11px Inter,sans-serif}.pill{display:inline-block;padding:5px 9px;background:#dcecf7;color:#174a78;font:700 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}.empty{padding:50px 20px;text-align:center;color:var(--muted);font:19px "Cormorant Garamond",Georgia,serif}.back{display:inline-block;margin-top:19px;color:var(--accent-dark);font:12px Inter,sans-serif;text-decoration:none}@media(max-width:600px){.admin-page{width:min(100% - 16px,980px);margin-top:18px}.admin-top{align-items:flex-start;flex-direction:column}.admin-login{margin:48px auto;padding:34px 22px}}</style></head><body><main class="admin-page"><section id="login" class="admin-login"><p class="eyebrow">Owner access</p><h1>RSVP admin</h1><p style="font:17px 'Cormorant Garamond',Georgia,serif;color:var(--muted)">Enter your admin details to view attendees.</p><input id="user" autocomplete="username" placeholder="Admin user"/><input id="pass" type="password" autocomplete="current-password" placeholder="Password"/><button class="admin-button primary" id="login-btn" style="width:100%;margin-top:12px">Sign in</button><p class="admin-error" id="error" hidden>Incorrect user or password.</p></section><section id="dashboard" hidden><div class="admin-top"><div><p class="eyebrow">Joseph & Juliet</p><h1>Attending guests</h1></div><div class="admin-actions"><button class="admin-button" id="export">Export CSV</button><button class="admin-button primary" id="refresh">Refresh</button></div></div><p class="admin-note">Simple local admin panel. It shows RSVP details stored in this browser.</p><section class="admin-table-wrap"><div id="empty" class="empty">No RSVP responses recorded yet.</div><table id="table" hidden><thead><tr><th>Names</th><th>Attendance</th><th>Guests</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table></section><a class="back" href="index.html">← Back to RSVP</a></section></main><script>const KEY='joseph-juliet-rsvps',USER='1234',PASS='5678';const login=()=>{if(document.querySelector('#user').value===USER&&document.querySelector('#pass').value===PASS){document.querySelector('#login').hidden=true;document.querySelector('#dashboard').hidden=false;load()}else document.querySelector('#error').hidden=false};document.querySelector('#login-btn').addEventListener('click',login);document.querySelector('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});const escapeHtml=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const load=()=>{const data=JSON.parse(localStorage.getItem(KEY)||'[]').reverse();document.querySelector('#rows').innerHTML=data.map(r=>`<tr><td><strong>${escapeHtml(r.names||'—')}</strong></td><td><span class="pill">${escapeHtml(r.attendance||'—')}</span></td><td>${escapeHtml(r.guests||'—')}</td><td><small>${r.submittedAt?new Date(r.submittedAt).toLocaleString():'—'}</small></td></tr>`).join('');document.querySelector('#empty').hidden=data.length>0;document.querySelector('#table').hidden=data.length===0};document.querySelector('#refresh').addEventListener('click',load);document.querySelector('#export').addEventListener('click',()=>{const data=JSON.parse(localStorage.getItem(KEY)||'[]');const csv=[['Names','Attendance','Guests','Submitted'],...data.map(r=>[r.names||'',r.attendance||'',r.guests||'',r.submittedAt||''])].map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='joseph-juliet-rsvp-responses.csv';a.click()});</script></body></html>
