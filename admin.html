<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joseph & Juliet | Attendees</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-page{width:min(100% - 24px,720px);margin:24px auto 30px}
    .admin-card{position:relative;background:#fff;border:1px solid #c8d9e8;box-shadow:0 18px 50px rgba(18,52,91,.13);overflow:hidden}
    .admin-card:before{content:"";display:block;height:6px;background:linear-gradient(90deg,#12345b,#2d6fa3,#a9cbe3,#2d6fa3,#12345b)}
    .admin-inner{padding:34px clamp(20px,6vw,52px) 38px;text-align:center}
    .admin-mark{width:42px;height:42px;margin:0 auto 10px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:18px}
    .admin-inner h1{margin:8px 0 24px;font-size:clamp(38px,7vw,58px);line-height:.9}
    .admin-inner h1 em{color:var(--accent-dark);font-weight:500}
    .admin-actions{display:grid;gap:12px;margin-top:26px}
    .admin-button{display:block;padding:15px 18px;border:1px solid var(--accent);background:#fff;color:var(--ink);text-decoration:none;font:700 10px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .admin-button.primary{background:var(--ink);color:#fff}
    .admin-footer{margin-top:20px;color:var(--muted);font:10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
    .admin-footer a{color:var(--accent-dark);text-decoration:none}
  </style>
</head>
<body>
  <main class="admin-page">
    <section class="admin-card" aria-labelledby="admin-title">
      <div class="admin-inner">
        <div class="admin-mark" aria-hidden="true">✦</div>
        <p class="eyebrow">Joseph & Juliet</p>
        <h1 id="admin-title">Attendee <em>list</em></h1>
        <div class="admin-actions">
          <a class="admin-button primary" href="https://docs.google.com/forms/d/1xcpOLy--xYXZCv94JdTJXU7ETKtD3dhg4DmtH1lOcMc/edit#responses" target="_blank" rel="noopener">View attendee details</a>
          <a class="admin-button" href="https://docs.google.com/forms/d/1xcpOLy--xYXZCv94JdTJXU7ETKtD3dhg4DmtH1lOcMc/viewanalytics" target="_blank" rel="noopener">View attendance summary</a>
        </div>
        <p class="admin-footer"><a href="index.html">← Back to RSVP</a></p>
      </div>
    </section>
  </main>
</body>
</html>
